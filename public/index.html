<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HackRadar</title>

<style>

body{
margin:0;
font-family:system-ui;
background:#0f3a5a;
color:white;
text-align:center;
}

/* HERO */

.hero{
height:520px;
background:url("/map.png") center/cover no-repeat;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.hero h1{
font-size:64px;
margin:0;
letter-spacing:2px;
}

.hero p{
font-size:18px;
opacity:0.9;
margin-top:10px;
}

/* LOGIN BUTTON */

.login-btn{
margin-top:30px;
padding:14px 36px;
font-size:18px;
border:none;
border-radius:8px;
background:#ec3750;
color:white;
cursor:pointer;
font-weight:600;
}

.login-btn:hover{
transform:scale(1.05);
}

/* INFO SECTION */

.section{
padding:60px 20px;
max-width:900px;
margin:auto;
}

.section h2{
font-size:32px;
margin-bottom:20px;
}

.cards{
display:flex;
flex-wrap:wrap;
gap:30px;
justify-content:center;
}

.card{
background:rgba(255,255,255,0.08);
padding:25px;
border-radius:10px;
max-width:250px;
}

.card h3{
margin-top:0;
}

.card p{
opacity:0.8;
}

/* FOOTER */

.footer{
padding:30px;
opacity:0.6;
font-size:14px;
}

</style>

</head>

<body>

<!-- HERO -->

<div class="hero">

<h1>HACKRADAR</h1>

<p>Discover Hack Club hackers around the world</p>

<a href="https://auth.hackclub.com/oauth/authorize?client_id=d8b24b29963240f7a26ef417ffc4ad4c&redirect_uri=http://localhost:3000/auth&response_type=code&scope=openid email name profile verification_status slack_id">

<button class="login-btn">
Login with Hack Club
</button>

</a>

</div>

<!-- ABOUT -->

<div class="section">

<h2>What is HackRadar?</h2>

<p>
HackRadar helps you discover Hack Club members around the world.  
Connect with hackers, collaborate on projects, and find people near you.
</p>

</div>



<div class="footer">
Built for Hack Club
</div>

</body>
</html>
